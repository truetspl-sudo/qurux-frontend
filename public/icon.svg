<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>QURUX</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8fb3"/>
      <stop offset="50%" stop-color="#f04a8f"/>
      <stop offset="100%" stop-color="#c81e62"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>

  <!-- Soft glow -->
  <ellipse cx="256" cy="200" rx="200" ry="160" fill="#ffffff" opacity="0.12"/>

  <!-- Big Q letter -->
  <text x="256" y="340" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="320" font-style="italic" font-weight="bold"
        fill="#ffffff">Q</text>

  <!-- QURUX text below -->
  <text x="256" y="470" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72" font-weight="bold" letter-spacing="12"
        fill="#ffffff" opacity="0.95">QURUX</text>
</svg>
