<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>QURUX</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5fa2"/>
      <stop offset="55%" stop-color="#ef2e7e"/>
      <stop offset="100%" stop-color="#d61f69"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square pink background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft top glow -->
  <ellipse cx="256" cy="150" rx="210" ry="140" fill="#ffffff" opacity="0.10"/>

  <!-- Big Q with tail -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="256" cy="240" r="128" stroke-width="52"/>
    <line x1="330" y1="322" x2="392" y2="392" stroke-width="52"/>
  </g>
</svg>
